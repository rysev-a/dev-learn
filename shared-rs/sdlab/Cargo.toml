[package]
name = "sdlab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Лаборатория «Системный дизайн» (книга 18): типы схемы, справочник компонентов, детерминированный движок расчёта, цели упражнений и серверная проверка решения. Общий crate фронтенда (wasm) и бэкенда."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
