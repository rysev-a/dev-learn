[package]
name = "content"
version = "0.1.0"
edition = "2021"
publish = false
description = "Данные курса: схемы слайдов (сцены из кадров), блоки слайдов, упражнения-лаборатории. Общий crate бэкенда (хранение, проверка) и фронтенда (отрисовка), а также генераторов содержимого."

[dependencies]
highlight = { path = "../highlight", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
