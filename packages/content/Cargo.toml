[package]
name = "content"
version = "0.1.0"
edition = "2021"
publish = false
description = "Course data: slide diagrams (scenes made of frames), slide blocks, lab exercises. Shared crate of the backend (storage, validation), the frontend (rendering) and the content generators."

[dependencies]
highlight = { path = "../highlight", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
