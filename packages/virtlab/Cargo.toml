[package]
name = "virtlab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lab for the Virtualization book (book 17): models of nine simulators, exercise goals and server-side solution checking. Shared crate for the UI (wasm) and the backend (native)."

[dependencies]
i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: numbers from JSON are read exactly (otherwise the last bit may differ from JavaScript)
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
locales = { path = "../locales" }
