[package]
name = "sdlab"
version = "0.1.0"
edition = "2021"
publish = false
description = "\"System design\" lab (book 18): design types, component catalog, deterministic evaluation engine, exercise goals and server-side solution verification. Shared crate for the frontend (wasm) and the backend."

[dependencies]
i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
locales = { path = "../locales" }
