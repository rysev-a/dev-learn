[package]
name = "riscvlab"
version = "0.1.0"
edition = "2021"
publish = false
description = "RISC-V lab (book 14, chapters 16-17): RV32IM instruction set, assembler, soft-processor emulator, exercises and solution checking. Shared crate for the backend (checking) and the frontend (wasm)."

[dependencies]
i18n = { path = "../i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
locales = { path = "../locales" }
