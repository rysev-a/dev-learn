[package]
name = "highlight"
version = "0.1.0"
edition = "2021"
publish = false
description = "Line-by-line syntax highlighting (Python, C, RISC-V assembly, Rust) with no dependencies: for slide diagrams and the exercise editor."

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
