name: Release deployment

# Create a release on GitHub and the site is updated. The images are built ON THE SERVER (the backend depends on closed libraries that the GitHub runner does not have),
#
# One-time setup needed (see docs/deploy.md, "Release deployment"):
#   secrets.DEPLOY_SSH_KEY   - the private key, which the server only allows to run deploy/server/release.sh
#   vars.DEPLOY_HOST, vars.DEPLOY_USER, vars.DEPLOY_HOST_KEY (a known_hosts line), vars.SITE_URL
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy (must already exist)
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to the site
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Build and start on the server
        run: git archive --format=tar.gz HEAD | ssh deploy "deploy $TAG"

      - name: Check the site from outside
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for path in / /api/books; do
            curl -fsS --retry 5 --retry-delay 5 --retry-connrefused -o /dev/null -w "$path %{http_code}\n" "$SITE_URL$path"
          done
