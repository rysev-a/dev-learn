name: Checks

# Tests of the shared crates and the frontend. The backend is not built here: it depends on closed libraries (the author's registry); it is checked locally and on deployment to the server.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Crates in packages/
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [i18n, locales, content, highlight, gen, weblab, sdlab, netlab, archlab, riscvlab, virtlab]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/${{ matrix.crate }}
      - run: cargo test --release
        working-directory: packages/${{ matrix.crate }}

  slides:
    name: Slide check (informational, the old chapters have 90 scene layout warnings)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gen
      - run: cargo run --release --bin lint_slides -- ../../backend/data/slides
        working-directory: packages/gen

  frontend:
    name: Frontend (Leptos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend
      - run: cargo test --workspace
        working-directory: frontend
      - run: cargo check --workspace --target wasm32-unknown-unknown
        working-directory: frontend
