# Traefik routes for development and access by machine address, HTTP only (file provider: the Docker socket is not mounted).
# /api -> backend; everything else -> frontend (Caddy with the Leptos static files; it answers /internal with 404).
http:
  routers:
    api:
      entryPoints: [web]
      rule: "PathPrefix(`/api`)"
      service: api
      middlewares: [secure]
    frontend:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      service: frontend
      middlewares: [secure]
  middlewares:
    secure:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        frameDeny: true
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
    frontend:
      loadBalancer:
        servers:
          - url: http://proxy:80
