# Traefik routes for the production server: the domain from CS_CORE_DOMAIN, HTTPS with a Let's Encrypt certificate (the `le` resolver is set by traefik flags in compose),
# HTTP only redirects to HTTPS. Enabled by the variable CS_CORE_TRAEFIK_CONFIG=./traefik/tls.yml. The site does not open by machine address without a domain.
# /api -> backend; everything else -> frontend (Caddy with the Leptos static files; it answers /internal with 404).
http:
  routers:
    http-to-https:
      entryPoints: [web]
      rule: "Host(`{{ env "CS_CORE_DOMAIN" }}`)"
      middlewares: [to-https]
      service: noop@internal
    www-http:
      entryPoints: [web]
      rule: "Host(`www.{{ env "CS_CORE_DOMAIN" }}`)"
      middlewares: [to-apex]
      service: noop@internal
    www-https:
      entryPoints: [websecure]
      rule: "Host(`www.{{ env "CS_CORE_DOMAIN" }}`)"
      middlewares: [to-apex]
      service: noop@internal
      tls:
        certResolver: le
    api:
      entryPoints: [websecure]
      rule: "Host(`{{ env "CS_CORE_DOMAIN" }}`) && PathPrefix(`/api`)"
      service: api
      middlewares: [secure]
      tls:
        certResolver: le
    frontend:
      entryPoints: [websecure]
      rule: "Host(`{{ env "CS_CORE_DOMAIN" }}`)"
      service: frontend
      middlewares: [secure]
      tls:
        certResolver: le
  middlewares:
    to-https:
      redirectScheme:
        scheme: https
        permanent: true
    to-apex:
      redirectRegex:
        regex: "^https?://www\\.(.*)"
        replacement: "https://${1}"
        permanent: true
    secure:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        frameDeny: true
        stsSeconds: 31536000
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
    frontend:
      loadBalancer:
        servers:
          - url: http://proxy:80
