# Бэкенд на axum + SurrealDB вместо Python-API: тот же сайт, прокси и воркер проверки кода.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.rust.yml --env-file deploy/.env up -d --build
# Сборка идёт с секретом `lab_token` (токен gitness для приватного реестра crates): LAB_TOKEN=… в окружении при сборке.
# Данные — в томе surreal-data (SurrealDB), пользователи и прогресс Python-бэкенда сюда не переносятся.
services:
  # сайт — Leptos-фронтенд (frontend-rs), а не React
  proxy:
    build: { context: .., dockerfile: deploy/proxy-rs.Dockerfile }

  api:
    build:
      context: ..
      dockerfile: deploy/backend-rs.Dockerfile
      secrets: [lab_token]
      # готовый `cargo vendor` вместо реестра lab (если до него нет сети); по умолчанию пусто — работает реестр с токеном
      additional_contexts:
        vendor: ${SAY_VENDOR_DIR:-./no-vendor}
    environment:
      # переменные Python-бэкенда не нужны; дописываются настройки Rust-бэкенда
      SAY_DB: !reset null
      SAY_RUNNER: !reset null
      SAY_DEFAULT_USERS: !reset null
      SAY_SECURE_COOKIE: !reset null
      SURREALDB_URL: ws://surrealdb:8000
      SURREAL_USER: root
      SURREAL_PASS: ${SURREAL_PASS:?задайте SURREAL_PASS в deploy/.env}
      DB_STRICT: "1" # без базы не стартуем: молча работать на базе в памяти нельзя
      ADMIN_EMAIL: ${ADMIN_EMAIL:?задайте ADMIN_EMAIL в deploy/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в deploy/.env}
      APP_URL: https://${SAY_SITE:-localhost}
      SITE_NAME: ${SITE_NAME:-CS.Core}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
    volumes: !reset []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/exercises/runner/status"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 180s
    depends_on:
      surrealdb: { condition: service_healthy }

  surrealdb:
    image: surrealdb/surrealdb:v3
    restart: unless-stopped
    user: "0:0"
    command: start --user root --pass ${SURREAL_PASS:?задайте SURREAL_PASS в deploy/.env} surrealkv:/data/database.db
    volumes:
      - surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [back]
    mem_limit: 1g
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # резервная копия SurrealDB вместо копий SQLite: раз в сутки HTTP-экспорт (SurrealQL) в том backups, хранятся последние 14
  # (в образе surrealdb нет оболочки, поэтому curl; восстановление — `surreal import` в чистую базу)
  backup:
    image: curlimages/curl:8.11.1
    build: !reset null
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 90
        while true; do
          f=/backups/say-$$(date +%Y%m%d-%H%M%S).surql
          if curl -fsS -u "root:$$SURREAL_PASS" -H "surreal-ns: stack" -H "surreal-db: say" -H "Accept: application/octet-stream" -o "$$f" http://surrealdb:8000/export; then
            echo "копия: $$f"
          else
            rm -f "$$f"; echo "ошибка копии"
          fi
          ls -1t /backups/say-*.surql 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    environment:
      SAY_DB: !reset null
      SAY_BACKUP_DIR: !reset null
      SURREAL_PASS: ${SURREAL_PASS}
    volumes: !reset
      - backups:/backups
    depends_on:
      surrealdb: { condition: service_healthy }

secrets:
  lab_token:
    environment: LAB_TOKEN

volumes:
  surreal-data:
