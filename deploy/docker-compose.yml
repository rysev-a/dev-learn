# Всё на одной машине, на которой есть только docker compose. Инструкция — docs/deploy-agent.md, рассуждения — deploy.md.
#   cp deploy/.env.example deploy/.env  (заполнить)
#   LAB_TOKEN=… docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Вариант без сборки на сервере: образы собираются и публикуются на другой машине (SAY_REGISTRY=ghcr.io/владелец/, SAY_TAG=2026-10-26):
#   LAB_TOKEN=… docker compose -f deploy/docker-compose.yml --env-file deploy/.env build && docker compose … push
#   на сервере: docker compose … pull && docker compose … up -d --no-build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile setup run --rm images   # один раз: образы песочниц
# Сборка бэкенда идёт с секретом `lab_token` (токен gitness для приватного реестра crates): LAB_TOKEN=… в окружении при сборке.
# Данные — в томе surreal-data (SurrealDB).
name: say

services:
  proxy:
    image: ${SAY_REGISTRY:-}say-proxy:${SAY_TAG:-latest}
    build: { context: .., dockerfile: deploy/proxy.Dockerfile }
    restart: unless-stopped
    ports:
      - "${SAY_HTTP_PORT:-80}:80"
      - "${SAY_HTTPS_PORT:-443}:443"
    environment:
      SAY_SITE: ${SAY_SITE:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    networks: [front]
    mem_limit: 256m
    logging: &log { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  api:
    image: ${SAY_REGISTRY:-}say-api:${SAY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      secrets: [lab_token]
      # готовый `cargo vendor` вместо реестра lab (если до него нет сети); по умолчанию пусто — работает реестр с токеном
      additional_contexts:
        vendor: ${SAY_VENDOR_DIR:-./no-vendor}
    restart: unless-stopped
    environment:
      SAY_WORKER_TOKEN: ${SAY_WORKER_TOKEN:?задайте SAY_WORKER_TOKEN в deploy/.env}
      SURREALDB_URL: ws://surrealdb:8000
      SURREAL_USER: root
      SURREAL_PASS: ${SURREAL_PASS:?задайте SURREAL_PASS в deploy/.env}
      DB_STRICT: "1" # без базы не стартуем: молча работать на базе в памяти нельзя
      ADMIN_EMAIL: ${ADMIN_EMAIL:?задайте ADMIN_EMAIL в deploy/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в deploy/.env}
      APP_URL: https://${SAY_SITE:-localhost}
      SITE_NAME: ${SITE_NAME:-CS.Core}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/exercises/runner/status"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 180s
    depends_on:
      surrealdb: { condition: service_healthy }
    networks: [front, back]
    mem_limit: 1g
    logging: *log

  surrealdb:
    image: surrealdb/surrealdb:v3
    restart: unless-stopped
    user: "0:0"
    command: start --user root --pass ${SURREAL_PASS:?задайте SURREAL_PASS в deploy/.env} surrealkv:/data/database.db
    volumes:
      - surreal-data:/data
    # доступ с хоста для разработки (Surrealist, surreal sql): только на 127.0.0.1, наружу порт не выходит.
    # Сеть back внутренняя (без выхода наружу), поэтому для публикации порта база дополнительно подключена к front.
    ports:
      - "127.0.0.1:${SAY_SURREAL_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [back, front]
    mem_limit: 1g
    logging: *log

  # отдельный Docker-демон только для песочниц: сокет хоста в контейнеры не монтируем
  dind:
    image: docker:29-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "-H", "unix:///var/run/docker.sock", "--log-opt", "max-size=10m", "--log-opt", "max-file=2"]
    volumes:
      - dind-data:/var/lib/docker
      # каталог с кодом ученика создаёт воркер, а монтирует в песочницу демон dind — путь должен быть один и тот же
      - sandboxes:/sandboxes
    cpus: ${SAY_SANDBOX_CPUS:-3}
    mem_limit: ${SAY_SANDBOX_MEM:-6g}
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 8s
      retries: 10
    networks: [sandbox]
    logging: *log

  worker:
    image: ${SAY_REGISTRY:-}say-worker:${SAY_TAG:-latest}
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    restart: unless-stopped
    command: ["python", "worker.py", "--server", "http://api:8000", "--name", "compose", "--light", "${SAY_LIGHT_SLOTS:-2}", "--heavy", "${SAY_HEAVY_SLOTS:-1}"]
    environment:
      SAY_WORKER_TOKEN: ${SAY_WORKER_TOKEN}
      DOCKER_HOST: tcp://dind:2375
      TMPDIR: /sandboxes
    volumes:
      - sandboxes:/sandboxes
    depends_on:
      api: { condition: service_healthy }
      dind: { condition: service_healthy }
    networks: [back, sandbox]
    mem_limit: 256m
    logging: *log

  # разово: заливает образы песочниц в dind (python, rust, node, say-rust-crates)
  images:
    image: ${SAY_REGISTRY:-}say-worker:${SAY_TAG:-latest}
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    profiles: [setup]
    command: ["/app/init-images.sh"]
    environment:
      DOCKER_HOST: tcp://dind:2375
    depends_on:
      dind: { condition: service_healthy }
    networks: [sandbox]

  # резервная копия SurrealDB: раз в сутки HTTP-экспорт (SurrealQL) в том backups, хранятся последние 14
  # (в образе surrealdb нет оболочки, поэтому curl; восстановление — `surreal import` в чистую базу)
  backup:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 90
        while true; do
          f=/backups/say-$$(date +%Y%m%d-%H%M%S).surql
          if curl -fsS -u "root:$$SURREAL_PASS" -H "surreal-ns: stack" -H "surreal-db: say" -H "Accept: application/octet-stream" -o "$$f" http://surrealdb:8000/export; then
            echo "копия: $$f"
          else
            rm -f "$$f"; echo "ошибка копии"
          fi
          ls -1t /backups/say-*.surql 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    environment:
      SURREAL_PASS: ${SURREAL_PASS}
    volumes:
      - backups:/backups
    depends_on:
      surrealdb: { condition: service_healthy }
    networks: [back]
    mem_limit: 128m
    logging: *log

secrets:
  lab_token:
    environment: LAB_TOKEN

networks:
  front:
  back:
    internal: true # у api и воркера нет выхода в интернет; наружу только proxy
  sandbox: # dind нужен выход для docker pull при подготовке образов; сами песочницы запускаются с --network none

volumes:
  caddy-data:
  caddy-config:
  surreal-data:
  backups:
  dind-data:
  sandboxes:
