# Everything on one machine that has only docker compose: traefik (entry), frontend (service `proxy`), api, surrealdb, backup.
# Code checking (worker + dind) is a separate profile `checks`: `--profile checks`. Instructions: docs/deploy-agent.md, rationale: deploy.md.
#   cp deploy/.env.example deploy/.env  (fill in)
#   LAB_TOKEN=… docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Variant without building on the server: images are built and published on another machine (CS_CORE_REGISTRY=ghcr.io/owner/, CS_CORE_TAG=2026-10-26):
#   LAB_TOKEN=… docker compose -f deploy/docker-compose.yml --env-file deploy/.env build && docker compose … push
#   on the server: docker compose … pull && docker compose … up -d --no-build
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile checks --profile setup run --rm images   # once: the sandbox images
# The backend is built with the secret `lab_token` (a gitness token for the private crate registry): set LAB_TOKEN=… in the environment at build time.
# Data lives in the surreal-data volume (SurrealDB).
name: cs-core

services:
  # the only entry point: Traefik accepts 80/443 and routes by traefik/dynamic.yml (the Docker socket is not mounted)
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      # Let's Encrypt certificates for production mode (traefik/tls.yml); until a router uses the resolver, no requests are made
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api=false
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${CS_CORE_HTTP_PORT:-80}:80"
      - "${CS_CORE_HTTPS_PORT:-443}:443"
    environment:
      CS_CORE_DOMAIN: ${CS_CORE_DOMAIN:-localhost}
    volumes:
      - ${CS_CORE_TRAEFIK_CONFIG:-./traefik/http.yml}:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api: { condition: service_healthy }
      proxy: { condition: service_started }
    networks: [front]
    mem_limit: 256m
    logging: &log { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # frontend: Caddy serving the Leptos static files inside the network (not published outside)
  proxy:
    image: ${CS_CORE_REGISTRY:-}cs-core-proxy:${CS_CORE_TAG:-latest}
    build: { context: .., dockerfile: deploy/proxy.Dockerfile }
    restart: unless-stopped
    environment:
      CS_CORE_SITE: ":80"
    depends_on:
      api: { condition: service_healthy }
    networks: [front]
    mem_limit: 256m
    logging: *log

  api:
    image: ${CS_CORE_REGISTRY:-}cs-core-api:${CS_CORE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      secrets: [lab_token]
      # a ready `cargo vendor` instead of the lab registry (if it is unreachable); empty by default, the registry with the token is used
      additional_contexts:
        vendor: ${CS_CORE_VENDOR_DIR:-./no-vendor}
    restart: unless-stopped
    environment:
      CS_CORE_WORKER_TOKEN: ${CS_CORE_WORKER_TOKEN:?set CS_CORE_WORKER_TOKEN in deploy/.env}
      # check queue limit: beyond it the backend answers 503 and the interface shows an overload notice
      CS_CORE_QUEUE_LIMIT: ${CS_CORE_QUEUE_LIMIT:-300}
      SURREALDB_URL: ws://surrealdb:8000
      SURREAL_USER: root
      SURREAL_PASS: ${SURREAL_PASS:?set SURREAL_PASS in deploy/.env}
      DB_STRICT: "1" # do not start without the database: silently running on an in-memory database is not allowed
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in deploy/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in deploy/.env}
      APP_URL: ${CS_CORE_URL:-http://localhost}
      SITE_NAME: ${SITE_NAME:-CS.Core}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/exercises/runner/status"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 180s
    depends_on:
      surrealdb: { condition: service_healthy }
    networks: [front, back]
    mem_limit: 1g
    logging: *log

  surrealdb:
    image: surrealdb/surrealdb:v3.3.4 # version pinned: the v3 tag floats, and the backend queries are verified on 3.3.4
    restart: unless-stopped
    user: "0:0"
    command: start --user root --pass ${SURREAL_PASS:?set SURREAL_PASS in deploy/.env} surrealkv:/data/database.db
    volumes:
      - surreal-data:/data
    # host access for development (Surrealist, surreal sql): on 127.0.0.1 only, the port is not exposed outside.
    # The back network is internal (no outbound access), so the database is also attached to front to publish the port.
    ports:
      - "127.0.0.1:${CS_CORE_SURREAL_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [back, front]
    mem_limit: 1g
    logging: *log

  # a separate Docker daemon for sandboxes only: the host socket is not mounted into containers
  dind:
    image: docker:29-dind
    profiles: [checks]
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "-H", "unix:///var/run/docker.sock", "--log-opt", "max-size=10m", "--log-opt", "max-file=2"]
    volumes:
      - dind-data:/var/lib/docker
      # the worker creates the directory with the student's code and the dind daemon mounts it into the sandbox, so the path must be the same
      - sandboxes:/sandboxes
    cpus: ${CS_CORE_SANDBOX_CPUS:-3}
    mem_limit: ${CS_CORE_SANDBOX_MEM:-6g}
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 8s
      retries: 10
    networks: [sandbox]
    logging: *log

  worker:
    image: ${CS_CORE_REGISTRY:-}cs-core-worker:${CS_CORE_TAG:-latest}
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    profiles: [checks]
    restart: unless-stopped
    command: ["python", "worker.py", "--server", "http://api:8000", "--name", "compose", "--light", "${CS_CORE_LIGHT_SLOTS:-2}", "--heavy", "${CS_CORE_HEAVY_SLOTS:-1}"]
    environment:
      CS_CORE_WORKER_TOKEN: ${CS_CORE_WORKER_TOKEN}
      DOCKER_HOST: tcp://dind:2375
      TMPDIR: /sandboxes
    volumes:
      - sandboxes:/sandboxes
    depends_on:
      api: { condition: service_healthy }
      dind: { condition: service_healthy }
    networks: [back, sandbox]
    mem_limit: 256m
    logging: *log

  # one-off: loads the sandbox images into dind (python, rust, node, cs-core-rust-crates)
  images:
    image: ${CS_CORE_REGISTRY:-}cs-core-worker:${CS_CORE_TAG:-latest}
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    profiles: [setup]
    command: ["/app/init-images.sh"]
    environment:
      DOCKER_HOST: tcp://dind:2375
    depends_on:
      dind: { condition: service_healthy }
    networks: [sandbox]

  # SurrealDB backup: a daily HTTP export (SurrealQL) into the backups volume, the last 14 are kept
  # (the surrealdb image has no shell, hence curl; restore with `surreal import` into a clean database)
  backup:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 90
        while true; do
          f=/backups/cs-core-$$(date +%Y%m%d-%H%M%S).surql
          if curl -fsS -u "root:$$SURREAL_PASS" -H "surreal-ns: stack" -H "surreal-db: cs-core" -H "Accept: application/octet-stream" -o "$$f" http://surrealdb:8000/export; then
            echo "backup: $$f"
          else
            rm -f "$$f"; echo "backup failed"
          fi
          ls -1t /backups/cs-core-*.surql 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    environment:
      SURREAL_PASS: ${SURREAL_PASS}
    volumes:
      - backups:/backups
    depends_on:
      surrealdb: { condition: service_healthy }
    networks: [back]
    mem_limit: 128m
    logging: *log

secrets:
  lab_token:
    environment: LAB_TOKEN

networks:
  front:
  back:
    internal: true # the api and the worker have no internet access; only proxy is exposed
  sandbox: # dind needs outbound access for docker pull while preparing images; the sandboxes themselves run with --network none

volumes:
  surreal-data:
  traefik-acme:
  backups:
  dind-data:
  sandboxes:
