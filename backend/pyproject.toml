[project]
name = "say"
version = "0.1.0"
description = "Аудиокурс «слушай учебник»: FastAPI + SQLite + kokoro-ru"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# озвучка (kokoro-ru, torch): нужна только для синтеза wav, веб-сервису и воркеру не нужна
voice = [
    "kokoro>=0.9.4",
    "ruaccent>=1.5.8.3",
    "soundfile>=0.14.0",
]
