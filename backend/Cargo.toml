# Parallel "cs-core" backend: axum + SurrealDB following the lab standard (web-services/standard.md).
#
# Versions and features live ONLY in [workspace.dependencies], and the list of shared crates and external dependencies matches 1:1 the list in
# /Users/rysev-a/Projects/lab/.worktrees/main/web-services/Cargo.toml (same Cargo.lock -> same versions, the prebuilt base images
# backend.base are built once). Only what lab lacks is added: rusqlite (reading the SQL init files), sha2 (the check cache key).
[package]
name = "cs-core-backend"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
# course data (slides, scenes), a crate shared with the frontend and the generators: packages/content
i18n = { path = "../packages/i18n" }
locales = { path = "../packages/locales" }
content = { path = "../packages/content" }
# lab engines: the server re-verifies submitted solutions with the same crates that are built to wasm for the interface
sdlab = { path = "../packages/sdlab" }
virtlab = { path = "../packages/virtlab" }
weblab = { path = "../packages/weblab" }
riscvlab = { path = "../packages/riscvlab" }
archlab = { path = "../packages/archlab" }
netlab = { path = "../packages/netlab" }
# shared crates (gitness registry `lab_crates`)
admin_api = { version = "0.2.1", registry = "lab" }
auth = { version = "0.2.5", registry = "lab" }
auth_api = { version = "0.2.3", registry = "lab" }
mail = { version = "0.2.4", registry = "lab" }
notifications = { version = "0.2.1", registry = "lab" }
observability = { version = "0.1.3", registry = "lab" }
system_tasks = { version = "0.2.2", registry = "lab" }
# uniform external dependency set of all backends (union of features)
anyhow = "1"
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = "11"
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.4"
serde_json = "1"
surrealdb = { version = "3", features = ["kv-mem", "protocol-ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# only here
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.11"

[dependencies]
i18n.workspace = true
locales.workspace = true
content.workspace = true
sdlab.workspace = true
virtlab.workspace = true
weblab.workspace = true
riscvlab.workspace = true
archlab.workspace = true
netlab.workspace = true
admin_api.workspace = true
auth.workspace = true
auth_api.workspace = true
mail.workspace = true
observability.workspace = true
system_tasks.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
dotenvy.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
surrealdb.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
