<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS.Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- shared styles of the app and labs -->
    <link data-trunk rel="css" href="styles/app.css" />
    <link data-trunk rel="css" href="styles/lab.css" />
    <link data-trunk rel="css" href="styles/netlab.css" />
    <link data-trunk rel="css" href="styles/sdlab.css" />
    <link data-trunk rel="css" href="styles/virtlab.css" />
    <!-- color themes: after app.css, they override its variables -->
    <link data-trunk rel="css" href="styles/themes.css" />
    <!-- textarea code editor and the rest of the app's own styles -->
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" data-bin="frontend" data-wasm-opt="0" />
  </head>
  <body>
    <!-- mode and color theme before the app loads, so the page does not flash default colors -->
    <script>
      try {
        var d = document.documentElement, t = localStorage.getItem("cs-core-theme") === "light" ? "light" : "dark";
        d.dataset.theme = t;
        var p = localStorage.getItem("cs-core-palette-" + t);
        if (p && p !== "default") d.dataset.palette = p;
      } catch (e) {}
    </script>
  </body>
</html>
