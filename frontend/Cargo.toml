# cs-core frontend on Leptos (CSR, trunk) following the lab standard (web-services/standard.md).
#
# Versions and features live ONLY here, in [workspace.dependencies]; the list of shared crates and external dependencies matches the frontend part of
# /Users/rysev-a/Projects/lab/.worktrees/main/web-services/Cargo.toml (Cargo.lock is taken from there, so the versions are the same). Differences from lab are
# only the extended web-sys feature list (events and ResizeObserver are needed) and the service's own crates (scene, api).
[workspace]
resolver = "2"
members = ["app", "crates/scene", "crates/api"]

[workspace.dependencies]
# The shared lab frontend crates (auth_client, ui_kit, admin_ui) are not used: as of 2026-10-22 they are missing from the `lab` registry index
# (even lab's own frontends do not resolve: "no matching package named auth_client"), so sign-in and forms are written here.
# uniform external dependency set of all frontends (wasm32)
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8.0", features = ["csr"] }
leptos_meta = "0.8.0"
leptos_router = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration", "Document", "DomRect", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement",
  "HtmlTextAreaElement", "KeyboardEvent", "Location", "MediaQueryList", "MouseEvent", "Node", "NodeList", "PointerEvent",
  "ResizeObserver", "ResizeObserverEntry", "Storage", "Window", "Navigator", "History", "WheelEvent", "SvgsvgElement",
  "Blob", "BlobPropertyBag", "HtmlAnchorElement", "Url",
  "HtmlAudioElement", "HtmlMediaElement", "AudioContext", "AudioBuffer", "BaseAudioContext",
  "BlobEvent", "MediaDevices", "MediaRecorder", "MediaRecorderOptions", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
] }

# the service's own crates
highlight = { path = "../packages/highlight" }
content = { path = "../packages/content" }
# lab engines (shared with the backend): computation in the browser and re-verification on the server with the same code
sdlab = { path = "../packages/sdlab" }
virtlab = { path = "../packages/virtlab" }
weblab = { path = "../packages/weblab" }
archlab = { path = "../packages/archlab" }
riscvlab = { path = "../packages/riscvlab" }
netlab = { path = "../packages/netlab" }
scene = { path = "crates/scene" }
api = { path = "crates/api" }
i18n = { path = "../packages/i18n" }
locales = { path = "../packages/locales" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
